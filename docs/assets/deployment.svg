<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840" role="img" aria-labelledby="title desc">
  <title id="title">Despliegue fisico del totem</title>
  <desc id="desc">Montaje fisico: monitor tactil vertical 1080x1920, mini PC con Windows 10 u 11, impresora termica por USB que aparece como puerto COM virtual y un equipo de operador que actualiza llamados.txt.</desc>

  <defs>
    <marker id="w" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5f7aa8"/>
    </marker>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#091422"/>
      <stop offset="100%" stop-color="#0c1c33"/>
    </linearGradient>
    <linearGradient id="screenG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12294a"/>
      <stop offset="54%" stop-color="#0f2138"/>
      <stop offset="54.2%" stop-color="#1a2f52"/>
      <stop offset="100%" stop-color="#0d1b30"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22314a"/>
      <stop offset="100%" stop-color="#141f31"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="840" fill="url(#bg3)"/>

  <text x="52" y="58" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="15" fill="#d4a843" letter-spacing="3">DESPLIEGUE FISICO</text>
  <text x="52" y="98" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Montaje en el punto de atencion</text>
  <text x="52" y="126" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="15" fill="#8ca0be">Tres cables, un ejecutable y dos archivos de texto. Nada mas que instalar del lado del totem.</text>
  <line x1="52" y1="146" x2="1228" y2="146" stroke="#d4a843" stroke-width="1.5" opacity="0.6"/>

  <!-- Floor line -->
  <line x1="52" y1="742" x2="1228" y2="742" stroke="#1d3557" stroke-width="2"/>
  <g opacity="0.35">
    <line x1="60" y1="742" x2="40" y2="768" stroke="#1d3557" stroke-width="1.5"/>
    <line x1="140" y1="742" x2="120" y2="768" stroke="#1d3557" stroke-width="1.5"/>
    <line x1="220" y1="742" x2="200" y2="768" stroke="#1d3557" stroke-width="1.5"/>
    <line x1="300" y1="742" x2="280" y2="768" stroke="#1d3557" stroke-width="1.5"/>
    <line x1="380" y1="742" x2="360" y2="768" stroke="#1d3557" stroke-width="1.5"/>
    <line x1="460" y1="742" x2="440" y2="768" stroke="#1d3557" stroke-width="1.5"/>
    <line x1="540" y1="742" x2="520" y2="768" stroke="#1d3557" stroke-width="1.5"/>
    <line x1="620" y1="742" x2="600" y2="768" stroke="#1d3557" stroke-width="1.5"/>
    <line x1="700" y1="742" x2="680" y2="768" stroke="#1d3557" stroke-width="1.5"/>
    <line x1="780" y1="742" x2="760" y2="768" stroke="#1d3557" stroke-width="1.5"/>
    <line x1="860" y1="742" x2="840" y2="768" stroke="#1d3557" stroke-width="1.5"/>
    <line x1="940" y1="742" x2="920" y2="768" stroke="#1d3557" stroke-width="1.5"/>
    <line x1="1020" y1="742" x2="1000" y2="768" stroke="#1d3557" stroke-width="1.5"/>
    <line x1="1100" y1="742" x2="1080" y2="768" stroke="#1d3557" stroke-width="1.5"/>
    <line x1="1180" y1="742" x2="1160" y2="768" stroke="#1d3557" stroke-width="1.5"/>
  </g>

  <!-- MONITOR -->
  <rect x="96" y="180" width="296" height="520" rx="12" fill="#0a1220" stroke="#3a4f70" stroke-width="3"/>
  <rect x="112" y="196" width="264" height="472" rx="6" fill="url(#screenG)" stroke="#1d3557" stroke-width="1"/>
  <!-- UI top: llamados -->
  <text x="244" y="228" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#d4a843" text-anchor="middle">LLAMADOS ACTIVOS</text>
  <line x1="152" y1="238" x2="336" y2="238" stroke="#d4a843" stroke-width="1" opacity="0.7"/>
  <rect x="126" y="250" width="236" height="34" rx="4" fill="#122a4a" stroke="#28406e" stroke-width="1"/>
  <text x="138" y="272" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#d4a843">A-041</text>
  <text x="206" y="272" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="11" fill="#e8f0fb">Modulo 4</text>
  <rect x="126" y="290" width="236" height="34" rx="4" fill="#122a4a" stroke="#28406e" stroke-width="1"/>
  <text x="138" y="312" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#d4a843">B-012</text>
  <text x="206" y="312" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="11" fill="#e8f0fb">Modulo 1</text>
  <rect x="126" y="330" width="236" height="34" rx="4" fill="#122a4a" stroke="#28406e" stroke-width="1"/>
  <text x="138" y="352" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#d4a843">C-003</text>
  <text x="206" y="352" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="11" fill="#e8f0fb">Modulo 5</text>
  <!-- separator -->
  <line x1="128" y1="404" x2="360" y2="404" stroke="#d4a843" stroke-width="1" opacity="0.5"/>
  <!-- UI bottom: buttons -->
  <text x="244" y="430" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="11" fill="#8ca0be" text-anchor="middle">Seleccione su tipo de atencion</text>
  <rect x="134" y="444" width="60" height="52" rx="9" fill="#3aa35b" opacity="0.9"/>
  <text x="204" y="466" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="12" fill="#ffffff">Atencion general</text>
  <text x="204" y="484" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="9.5" fill="#9db4d6">tramites y consultas</text>
  <rect x="134" y="508" width="60" height="52" rx="9" fill="#2f6fd0" opacity="0.9"/>
  <text x="204" y="530" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="12" fill="#ffffff">Creditos</text>
  <text x="204" y="548" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="9.5" fill="#9db4d6">solicitud y consulta</text>
  <rect x="134" y="572" width="60" height="52" rx="9" fill="#c0392b" opacity="0.9"/>
  <text x="204" y="594" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="12" fill="#ffffff">Preferencial</text>
  <text x="204" y="612" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="9.5" fill="#9db4d6">adultos mayores</text>
  <text x="244" y="652" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="10" fill="#6b86b8" text-anchor="middle">1080 x 1920 px</text>

  <!-- Stand -->
  <rect x="226" y="700" width="36" height="42" fill="url(#metal)"/>
  <rect x="150" y="738" width="188" height="12" rx="4" fill="#1a2740" stroke="#31496d" stroke-width="1"/>

  <!-- MINI PC -->
  <rect x="480" y="268" width="286" height="164" rx="10" fill="url(#metal)" stroke="#3a4f70" stroke-width="2"/>
  <circle cx="748" cy="292" r="5" fill="#7ee0a8"/>
  <text x="504" y="300" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Mini PC / NUC</text>
  <text x="504" y="322" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="12" fill="#9db4d6">Windows 10 u 11 · 64 bits</text>
  <line x1="504" y1="334" x2="742" y2="334" stroke="#2a4066" stroke-width="1"/>
  <text x="504" y="355" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="11.5" fill="#8cc4ff">C:\Totem\</text>
  <text x="504" y="374" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="11.5" fill="#7ee0a8">  totem.exe</text>
  <text x="504" y="392" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="11.5" fill="#7ee0a8">  llamados.txt</text>
  <text x="504" y="410" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="11.5" fill="#e8c060">  contadores.dat (generado)</text>

  <rect x="560" y="432" width="126" height="16" rx="3" fill="#0c1728" stroke="#2a4066" stroke-width="1"/>
  <text x="623" y="444" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="9" fill="#5f7aa8" text-anchor="middle">HDMI / DP</text>
  <rect x="600" y="456" width="46" height="14" rx="3" fill="#0c1728" stroke="#2a4066" stroke-width="1"/>
  <rect x="606" y="470" width="34" height="12" rx="2" fill="#0c1728" stroke="#2a4066" stroke-width="1"/>

  <!-- PRINTER -->
  <rect x="892" y="252" width="300" height="188" rx="10" fill="#1b2436" stroke="#4a5b78" stroke-width="2"/>
  <rect x="892" y="252" width="300" height="40" rx="10" fill="#232f46" stroke="#4a5b78" stroke-width="2"/>
  <text x="916" y="278" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#e2e9f5">Impresora termica 80 mm</text>
  <rect x="916" y="306" width="252" height="10" rx="3" fill="#05080d"/>
  <rect x="934" y="296" width="216" height="9" rx="2" fill="#f3f6fb" opacity="0.92"/>
  <text x="1042" y="290" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="9" fill="#9db4d6" text-anchor="middle">ticket</text>
  <text x="916" y="340" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#9db4d6">ESC/POS · 9600 8N1 · corte automatico</text>
  <text x="916" y="360" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#9db4d6">sin driver GDI: se usa el COM virtual</text>
  <circle cx="932" cy="392" r="7" fill="#7ee0a8"/>
  <text x="948" y="396" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="11" fill="#7ee0a8">power</text>
  <circle cx="1010" cy="392" r="7" fill="#e8c060"/>
  <text x="1026" y="396" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="11" fill="#e8c060">feed</text>
  <rect x="1074" y="382" width="96" height="20" rx="4" fill="#0c1728" stroke="#2a4066" stroke-width="1"/>
  <text x="1122" y="396" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="9.5" fill="#8cc4ff" text-anchor="middle">USB-B</text>

  <!-- OPERATOR PC -->
  <rect x="480" y="512" width="286" height="150" rx="10" fill="#101d33" stroke="#2c4570" stroke-width="1.6"/>
  <text x="504" y="540" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#ffffff">Equipo del operador</text>
  <text x="504" y="562" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#9db4d6">edita llamados.txt (Bloc de notas)</text>
  <text x="504" y="582" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#9db4d6">o lo escribe un sistema de turnos</text>
  <rect x="504" y="596" width="238" height="46" rx="5" fill="#0a1526" stroke="#22395e" stroke-width="1"/>
  <text x="514" y="613" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="10.5" fill="#7ee0a8">A-41|Modulo 4</text>
  <text x="514" y="630" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="10.5" fill="#7ee0a8">B-12|Modulo 1</text>

  <!-- Cables -->
  <path d="M392 470 L480 400" fill="none" stroke="#5f7aa8" stroke-width="2.4" marker-end="url(#w)"/>
  <text x="404" y="424" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="10.5" fill="#7f95b6">HDMI</text>
  <path d="M392 620 L480 640" fill="none" stroke="#7ee0a8" stroke-width="2.4" marker-end="url(#w)"/>
  <text x="398" y="646" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="10.5" fill="#7ee0a8">USB tactil</text>
  <path d="M766 340 L892 340" fill="none" stroke="#e8c060" stroke-width="2.4" marker-end="url(#w)"/>
  <text x="776" y="330" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="10.5" fill="#e8c060">USB</text>
  <text x="776" y="362" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="10.5" fill="#e8c060">COMx</text>
  <path d="M766 560 L860 560 L860 700 L620 700" fill="none" stroke="#6b86b8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#w)"/>
  <text x="866" y="556" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="10.5" fill="#8ca0be">LAN / carpeta compartida</text>

  <!-- Callout notes -->
  <rect x="892" y="470" width="300" height="200" rx="10" fill="#0b1830" stroke="#243d66" stroke-width="1.4"/>
  <text x="912" y="498" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#8cc4ff">Checklist de montaje</text>
  <text x="912" y="522" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#b9cbe6">1. Pantalla en vertical, escala 100 %</text>
  <text x="912" y="544" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#b9cbe6">2. Impresora instalada y con papel</text>
  <text x="912" y="566" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#b9cbe6">3. Probar el puerto COM con un ticket</text>
  <text x="912" y="588" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#b9cbe6">4. llamados.txt junto al .exe</text>
  <text x="912" y="610" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#b9cbe6">5. Autoarranque en el inicio de sesion</text>
  <text x="912" y="632" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#b9cbe6">6. Bloquear el escritorio al operador</text>
  <text x="912" y="656" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="11" fill="#7f95b6">Esquema de referencia, no validado en campo.</text>

  <text x="52" y="788" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#7f95b6">El totem no necesita red para operar: la pantalla de llamados se alimenta de un archivo local. La red solo aparece si un sistema externo publica ese archivo.</text>
  <text x="52" y="818" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="11" fill="#d4a843" letter-spacing="2">docs/assets/deployment.svg</text>
</svg>
